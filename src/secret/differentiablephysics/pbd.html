<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle app</title>
  </head>
  <body>
    <div id="renderer-panel">
      <canvas id="canvas" width="1024" height="1024"></canvas>
      <section id="display-controls" aria-label="Display controls">
        <button id="display-controls-toggle" type="button" aria-expanded="true" aria-controls="display-controls-body">
          CONTROLS
        </button>
        <div id="display-controls-body">
          <div class="display-section">DISPLAY</div>
          <label for="show-particles">
            <input id="show-particles" type="checkbox" checked />
            particles
          </label>
          <label for="show-triangles">
            <input id="show-triangles" type="checkbox" checked />
            triangle faces
          </label>
          <label for="show-floor">
            <input id="show-floor" type="checkbox" checked />
            floor plane
          </label>
          <p class="display-note">Visibility only</p>
          <a href="./">Spring foundations</a>
        </div>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
